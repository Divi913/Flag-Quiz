<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Flag Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one centered column, like a signal card held up — flag big, four answer buttons below, progress as a row of pennants */
:root{
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#0F1E36; --muted:#5B6B84; --line:#D5DDE9;
  --accent:#F2B705; --accent-ink:#0F1E36; --good:#1E8E4E; --good-bg:#DDF3E5; --bad:#C2352B; --bad-bg:#FBE2DF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1424; --card:#14213A; --ink:#E9EEF6; --muted:#9AA9C2; --line:#2B3C60;
  --accent:#F5C534; --accent-ink:#0B1424; --good:#4CC27F; --good-bg:#123826; --bad:#F07065; --bad-bg:#43191A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1424; --card:#14213A; --ink:#E9EEF6; --muted:#9AA9C2; --line:#2B3C60;
  --accent:#F5C534; --accent-ink:#0B1424; --good:#4CC27F; --good-bg:#123826; --bad:#F07065; --bad-bg:#43191A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;padding-inline:16px;padding-block:20px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.score{font-family:var(--display);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.score b{color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.levels button{font:800 1rem var(--display);letter-spacing:.05em;text-transform:uppercase;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.levels button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.modes button{font:600 1rem var(--body);border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:focus-visible,.chip:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.settings{align-items:stretch;gap:18px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .95rem var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range label{color:var(--muted)}
select{font:600 1rem var(--body);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.match{margin:0;color:var(--muted);text-align:center}
.match b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.lives{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hearts{display:flex;gap:6px}
.hearts svg{width:22px;height:22px;display:block}
.hearts .full{fill:var(--bad)} .hearts .lost{fill:none;stroke:var(--line);stroke-width:2}
.tier{font:800 1rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tier b{color:var(--ink)}
.best{color:var(--muted)}
.board{width:100%;display:flex;flex-direction:column;gap:4px;text-align:left}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.board li .rk{font:800 1.1rem var(--display);color:var(--muted)}
.board li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.board li .sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.board li .pt{font:800 1.3rem var(--display)}
.board li.me{box-shadow:inset 0 0 0 2px var(--accent)}
.board li:nth-child(1) .rk{color:var(--accent)}
.boardnote{font-size:.85rem;color:var(--muted);text-align:center;margin:4px 0 0}
.saveform{width:100%;display:flex;gap:8px}
.saveform input{flex:1;min-width:0;font:600 1rem var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.saveform input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.saveform .btn{width:auto;margin:0;padding:12px 18px}
.formmsg{font-size:.9rem;min-height:1.2em;margin:0;text-align:center}
.rules{margin:0;padding-left:1.2em;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.bar{display:flex;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .ok{background:var(--good)} .bar .no{background:var(--bad)}
.leveldesc{margin:-6px 0 0;font-size:.9rem;color:var(--muted);text-align:center}
.pennants{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pennants span{height:8px;border-radius:2px;background:var(--line)}
.pennants .ok{background:var(--good)} .pennants .no{background:var(--bad)} .pennants .now{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.flag{font-size:clamp(6rem,34vw,9rem);line-height:1.1;font-family:var(--emoji)}
.flagsvg{width:min(100%,270px);max-width:100%;display:block}
.flagsvg svg,.flagsvg img{width:100%;height:auto;max-height:200px;display:block;filter:drop-shadow(0 0 .6px var(--muted)) drop-shadow(0 5px 10px rgb(15 30 54 / .14))}
.flagsvg img{width:auto;max-width:100%;margin:0 auto}
.hint{font-size:.95rem;color:var(--muted);text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:600 1.02rem/1.25 var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 10px;min-height:64px;cursor:pointer;text-wrap:balance;transition:transform .08s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.5em;text-align:center;font-weight:600;margin-top:12px}
.factbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:4px}
.factbox .label{font-size:.72rem}
.fact{color:var(--ink);font-size:.98rem;line-height:1.45;margin:0;text-wrap:pretty}
.levelup{text-align:center;font:800 1rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:8px;margin-top:10px}
.btn{font:800 1.2rem var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;cursor:pointer;width:100%;margin-top:12px}
.result{text-align:center}
.big{font-family:var(--display);font-weight:800;font-size:5rem;line-height:1;font-variant-numeric:tabular-nums}
.missed{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.missed div{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg)}
.missed .s{width:54px;flex:none}
.missed .s img{width:auto;max-width:100%;max-height:40px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 .6px var(--muted))}
.missed .s svg{width:100%;height:auto;max-height:40px;display:block;filter:drop-shadow(0 0 .6px var(--muted))}
.credit{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.4}
.credit a{color:inherit}
.burst{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:50}
.burst i{position:absolute;left:0;top:0;width:8px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:pop .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.opt.right.cheer{animation:cheer .45s ease-out}
@keyframes cheer{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.card.glow{animation:glow .7s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
.feedback .streak{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:800 .95rem var(--display);letter-spacing:.06em;text-transform:uppercase;animation:cheer .45s ease-out}
@media (prefers-reduced-motion:reduce){.opt{transition:none}.burst{display:none}.opt.right.cheer,.card.glow,.feedback .streak{animation:none}}
</style>

<div class="wrap">
  <header><h1>Flag Quiz</h1><div class="score"><span id="scorelabel">Score</span> <b id="score">0</b><span id="outof">/<span id="total">10</span></span></div></header>
  <div class="modes" id="modes" role="group" aria-label="Mode"><button id="m-quiz" data-m="quiz" aria-pressed="true">Quiz</button><button id="m-practice" data-m="practice" aria-pressed="false">Practice</button><button id="m-challenge" data-m="challenge" aria-pressed="false">Challenge</button></div>
  <div class="levels" id="levels" role="group" aria-label="Difficulty">
    <button id="lv-easy" data-l="easy" aria-pressed="true">Easy</button>
    <button id="lv-medium" data-l="medium" aria-pressed="false">Medium</button>
    <button id="lv-hard" data-l="hard" aria-pressed="false">Hard</button>
    <button id="lv-expert" data-l="expert" aria-pressed="false">Expert</button>
  </div>
  <p class="leveldesc" id="leveldesc"></p>
  <div class="pennants" id="pennants"></div>
  <main id="stage"></main>
  <footer class="credit">Flag images: country flags from the public-domain svg-country-flags set and <a href="https://flagicons.lipis.dev/" target="_blank" rel="noopener">flag-icons</a>, U.S. state flags from <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>, and historical and regional flags from <a href="https://flaglog.com/" target="_blank" rel="noopener">The World Flag Chart</a>.</footer>
</div>

<script>
/* ---------- drawing helpers (300×200 canvas) ---------- */
const R=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const full=f=>R(0,0,300,200,f);
const hs=c=>c.map((f,k)=>R(0,(k*200/c.length).toFixed(2),300,(200/c.length+.6).toFixed(2),f)).join("");
const circ=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const line=(a,b,c,d,s,w)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${s}" stroke-width="${w}" stroke-linecap="square"/>`;
const poly=(pts,f)=>`<polygon points="${pts}" fill="${f}"/>`;
const cross=(x,y,w,f)=>R(x-w/2,0,w,200,f)+R(0,y-w/2,300,w,f);
function star(cx,cy,r,f,n=5,ir=.382,rot=-90){const p=[];for(let k=0;k<2*n;k++){const a=(rot+k*180/n)*Math.PI/180,rr=k%2?r*ir:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}return poly(p.join(" "),f)}
const vstripes=(x,y,w,h,n,a,b)=>Array.from({length:n},(_,k)=>R((x+k*w/n).toFixed(2),y,(w/n+.5).toFixed(2),h,k%2?b:a)).join("");
function ermine(x,y){return circ(x-5,y-9,2.3,"#000")+circ(x,y-12,2.3,"#000")+circ(x+5,y-9,2.3,"#000")+poly(`${x},${y-6} ${x+5},${y+9} ${x},${y+5} ${x-5},${y+9}`,"#000")}

const SVG={
  // states, provinces, regions
  texas:()=>full("#BF0A30")+R(0,0,300,100,"#fff")+R(0,0,100,200,"#002868")+star(50,100,34,"#fff"),
  colorado:()=>hs(["#002868","#fff","#002868"])+`<path d="M164.8 130.9 A48 48 0 1 1 164.8 69.1" fill="none" stroke="#BF0A30" stroke-width="34"/>`+circ(128,100,30,"#FFD700"),
  alaska:()=>full("#0F204B")+[[48,79],[83,92],[101,110],[119,128],[116,154],[156,166],[172,146]].map(([x,y])=>star(x,y,8.5,"#FFB612")).join("")+star(245,37,14,"#FFB612"),
  newmexico:()=>{const r="#BF0A30";let s=full("#FFD100")+`<circle cx="150" cy="100" r="14.7" fill="none" stroke="${r}" stroke-width="4"/>`;const o=[-12,-4,4,12],L=[27.5,33,33,27.5],t=4;o.forEach((d,k)=>{const l=L[k],a=(k==0||k==3)?Math.sqrt(16.7*16.7-144):16.7,st=Math.max(a,10.5)-2;s+=R(150+st,100+d-t/2,50-st-(33-l),t,r)+R(150-st-(50-st-(33-l)),100+d-t/2,50-st-(33-l),t,r)+R(150+d-t/2,100-st-(50-st-(33-l)),t,50-st-(33-l),r)+R(150+d-t/2,100+st,t,50-st-(33-l),r)});return s},
  arizona:()=>{let s=`<defs><clipPath id="az"><rect width="300" height="100"/></clipPath></defs>`+R(0,100,300,100,"#002868")+`<g clip-path="url(#az)">`;for(let k=0;k<13;k++){const a1=Math.PI+k*Math.PI/13,a2=Math.PI+(k+1)*Math.PI/13;s+=poly(`150,100 ${(150+400*Math.cos(a1)).toFixed(1)},${(100+400*Math.sin(a1)).toFixed(1)} ${(150+400*Math.cos(a2)).toFixed(1)},${(100+400*Math.sin(a2)).toFixed(1)}`,k%2?"#FED700":"#BF0A30")}return s+"</g>"+star(150,100,50,"#CE5C17")},
  tennessee:()=>full("#CC0000")+R(266,0,6,200,"#fff")+R(272,0,28,200,"#002868")+circ(135,100,54,"#fff")+circ(135,100,49,"#002868")+star(117,78,17,"#fff",5,.382,-80)+star(155,92,17,"#fff",5,.382,-80)+star(127,123,17,"#fff",5,.382,-80),
  puertorico:()=>hs(["#ED0000","#fff","#ED0000","#fff","#ED0000"])+poly("0,0 172,100 0,200","#0050F0")+star(57,100,28,"#fff"),
  greenland:()=>R(0,0,300,100,"#fff")+R(0,100,300,100,"#C8102E")+`<path d="M50 100 A66.7 66.7 0 0 1 183.4 100Z" fill="#C8102E"/><path d="M50 100 A66.7 66.7 0 0 0 183.4 100Z" fill="#fff"/>`,
  faroe:()=>full("#fff")+cross(108,100,44,"#003897")+cross(108,100,22,"#D72828"),
  aland:()=>full("#0053A5")+cross(121,100,59,"#FFCE00")+cross(121,100,23.5,"#D21034"),
  scotland:()=>full("#005EB8")+line(0,0,300,200,"#fff",34)+line(300,0,0,200,"#fff",34),
  cornwall:()=>full("#000")+cross(150,100,40,"#fff"),
  catalonia:()=>hs(Array.from({length:9},(_,k)=>k%2?"#DA121A":"#FCDD09")),
  basque:()=>full("#D52B1E")+line(0,0,300,200,"#009B48",28)+line(300,0,0,200,"#009B48",28)+cross(150,100,26,"#fff"),
  galicia:()=>full("#fff")+line(0,0,300,200,"#0099CC",56),
  bavaria:()=>`<defs><pattern id="bv" width="30" height="34" patternUnits="userSpaceOnUse"><rect width="30" height="34" fill="#fff"/><polygon points="15,0 30,17 15,34 0,17" fill="#0098D4"/></pattern></defs><rect width="300" height="200" fill="url(#bv)"/>`,
  kurdistan:()=>hs(["#ED2024","#fff","#278E43"])+star(150,100,38,"#FEBD11",21,.6)+circ(150,100,22,"#FEBD11"),
  brittany:()=>{let s=hs(Array.from({length:9},(_,k)=>k%2?"#fff":"#000"))+R(0,0,125,111.1,"#fff");[[25,[20,52,84,108]],[56,[36,68,100]],[87,[20,52,84,108]]].forEach(([y,xs])=>xs.forEach(x=>s+=ermine(x,y)));return s},
  // cities
  chicago:()=>full("#fff")+R(0,30,300,33.4,"#41B6E6")+R(0,136.6,300,33.4,"#41B6E6")+[81,127,173,219].map(x=>star(x,100,23,"#FF0000",6,.5)).join(""),
  dc:()=>full("#fff")+[65,150,235].map(x=>star(x,35,18,"#E91436")).join("")+R(0,60,300,37,"#E91436")+R(0,118,300,37,"#E91436"),
  amsterdam:()=>hs(["#EC0000","#000","#EC0000"])+[90,150,210].map(x=>line(x-20,80,x+20,120,"#fff",10)+line(x+20,80,x-20,120,"#fff",10)).join(""),
  rotterdam:()=>hs(["#00843D","#fff","#00843D"]),
  hague:()=>hs(["#FFDD00","#009B3A"]),
  munich:()=>hs(["#000","#FFC72C"]),
  warsaw:()=>hs(["#FFD200","#E00025"]),
  krakow:()=>hs(["#fff","#00A0E3"]),
  barcelona:()=>{const r="#DA121A",y="#FCDD09";return R(0,0,150,100,"#fff")+R(66,0,18,100,r)+R(0,41,150,18,r)+R(150,100,150,100,"#fff")+R(216,100,18,100,r)+R(150,141,150,18,r)+vstripes(150,0,150,100,9,y,r)+vstripes(0,100,150,100,9,y,r)},
  // historical
  libya77:()=>full("#009A3A"),
  svn:()=>full("#FFCD00")+R(0,66.7,300,13.3,"#DA251D")+R(0,93.3,300,13.4,"#DA251D")+R(0,120,300,13.3,"#DA251D"),
  manchukuo:()=>full("#FFD700")+R(0,0,100,25,"#D52B1E")+R(0,25,100,25,"#0033A0")+R(0,50,100,25,"#fff")+R(0,75,100,25,"#000"),
  rusemp:()=>hs(["#000","#FFD700","#fff"]),
  yugo:()=>hs(["#003893","#fff","#DE0000"])+star(150,100,60,"#FCD116")+star(150,100,52,"#DE0000"),
  egyptk:()=>full("#0F7B3E")+circ(125,100,55,"#fff")+circ(142,100,47,"#0F7B3E")+star(163,72,11,"#fff")+star(178,100,11,"#fff")+star(163,128,11,"#fff"),
  biafra:()=>{const g="#FFC20E";let s=hs(["#E7262C","#000","#00A651"]);for(let k=0;k<11;k++){const a=(185+k*17)*Math.PI/180,b=1.7*Math.PI/180,x=150,y=118;s+=poly(`${(x+18*Math.cos(a-b)).toFixed(1)},${(y+18*Math.sin(a-b)).toFixed(1)} ${(x+49*Math.cos(a)).toFixed(1)},${(y+49*Math.sin(a)).toFixed(1)} ${(x+18*Math.cos(a+b)).toFixed(1)},${(y+18*Math.sin(a+b)).toFixed(1)}`,g)}return s+`<path d="M134 118 A16 16 0 0 1 166 118Z" fill="${g}"/>`+R(105,120,90,7,g)},
  ghana64:()=>hs(["#CE1126","#fff","#006B3F"])+star(150,100,30,"#000"),
  tanganyika:()=>full("#1EB53A")+R(0,68,300,64,"#FCD116")+R(0,76,300,48,"#000"),
  uar:()=>hs(["#CE1126","#fff","#000"])+star(115,100,22,"#007A3D")+star(185,100,22,"#007A3D"),

const STORE={c:null,r:null,f:null};const loading={};
function load(src){if(STORE[src])return Promise.resolve();return loading[src]||(loading[src]=fetch({c:"countries.json",r:"regions.json",f:"flaglog.json"}[src]).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{STORE[src]=j}))}

function drawFlag(f,small){
  const label=(small?f.name:"Mystery flag").replace(/"/g,"");
  const cls=small?"s":"flagsvg";
  if(f.src==="f")return `<span class="${cls}"><img src="${STORE.f[f.code]}" alt="${label}"></span>`;
  let svg=f.src==="d"?`<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">${SVG[f.code]()}</svg>`:STORE[f.src][f.code];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function confetti(el){
  const r=el.getBoundingClientRect(),b=document.createElement("div");b.className="burst";b.style.left=(r.left+r.width/2)+"px";b.style.top=(r.top+r.height/2)+"px";

const P=Object.assign({conts:CONTS.slice(),types:["country","region"],min:0,max:3,count:10},store.get("fq-practice",{}));

function pick(pool,n){
  const fresh=shuffle(pool.filter(f=>!recent.includes(f.code)));
  const used=shuffle(pool.filter(f=>recent.includes(f.code)));
  return fresh.concat(used).slice(0,n);
}
function levelRound(){
  const world=ALL.filter(f=>f.kind==="region"&&f.group==="world");
  const us=ALL.filter(f=>f.group==="us");
  const cities=DRAWN.filter(d=>d.kind==="city"&&d.group!=="us");
  if(level==="easy")return pick(COUNTRIES.filter(c=>c.tier==="e"),10);
  if(level==="medium")return pick(COUNTRIES.filter(c=>c.tier==="m"),10);
  if(level==="hard")return pick(us,4).concat(pick(world,4),pick(cities,2));
  return pick(ALL.filter(f=>f.kind==="hist"),6).concat(pick(world.concat(cities),4));
}
function practicePool(){
  const allConts=CONTS.every(c=>P.conts.includes(c));
  return ALL.filter(f=>P.types.includes(f.kind)&&(allConts||P.conts.includes(f.cont))&&f.diff-1>=P.min&&f.diff-1<=P.max);
}
function distractors(q){
  const pool=mode==="practice"&&lastPool?lastPool:ALL;
  const same=pool.filter(c=>c!==q&&c.kind===q.kind),any=ALL.filter(c=>c!==q&&c.kind===q.kind);
  let tiers;
  if(q.kind==="country")tiers=[q.group&&q.tier==="m"?any.filter(c=>c.group===q.group):[],same.filter(c=>c.cont===q.cont),same,any.filter(c=>c.cont===q.cont),any];
  else tiers=[same.filter(c=>c.group===q.group&&c.cont===q.cont),same.filter(c=>c.group===q.group),same,any];
  const out=[];for(const t of tiers)for(const c of shuffle(t))if(out.length<3&&base(c.name)!==base(q.name)&&!out.some(o=>base(o.name)===base(c.name)))out.push(c);
  return out;
}

function loadThen(list,fn){
  const want=srcsOf(list.concat(...list.map(distractors)));
  if(want.some(s=>!STORE[s]))$("stage").innerHTML=`<div class="card"><div class="label">Loading flags…</div></div>`;
  const token=Symbol();loadThen.t=token;
  Promise.all(want.map(load)).then(()=>{if(loadThen.t===token)fn();["c","r","f"].forEach(x=>load(x).catch(()=>{}))})
  .catch(()=>{$("stage").innerHTML=`<div class="card"><div class="label">Couldn't load the flags</div><button class="btn" id="retry">Try again</button></div>`;$("retry").onclick=()=>{want.forEach(x=>delete loading[x]);loadThen(list,fn)}});
}
function begin(list){
  qs=list;total=qs.length;i=0;score=0;log=[];streak=0;
  recent.push(...qs.map(f=>f.code));saveRecent();
  $("score").textContent=0;$("total").textContent=total;
  // pre-pick options so we know every image the round needs
  qs.forEach(q=>q._opts=shuffle([q,...distractors(q)]));
  loadThen(qs.concat(...qs.map(q=>q._opts)),ask);
}

  if(mode==="challenge"){el.className="lives";el.style.gridTemplateColumns="";const heart=c=>`<svg viewBox="0 0 24 24" class="${c}"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3.1 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.6 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>`;el.innerHTML=`<div class="hearts" aria-label="${lives} lives left">${[0,1,2].map(k=>heart(k<lives?"full":"lost")).join("")}</div><div class="tier">Level <b>${DIFFS[tierAt(log.length)-1]}</b></div>`;return}
  if(total<=20){el.className="pennants";el.style.gridTemplateColumns=`repeat(${total},1fr)`;el.innerHTML=Array.from({length:total},(_,k)=>`<span class="${k<log.length?(log[k].ok?"ok":"no"):k===i?"now":""}"></span>`).join("")}
  else{const ok=log.filter(l=>l.ok).length;el.className="bar";el.style.gridTemplateColumns="";el.innerHTML=`<span class="ok" style="width:${ok/total*100}%"></span><span class="no" style="width:${(log.length-ok)/total*100}%"></span>`}
}
function ask(){
  progress();
  const q=qs[i],opts=q._opts;
  $("stage").innerHTML=`
    <div class="card">
      <div class="label">${mode==="challenge"?`Flag ${i+1} · ${q.diff} pt${q.diff>1?"s":""}`:`Flag ${i+1} of ${total}`}${mode==="practice"?` · ${DIFFS[q.diff-1]}`:""}</div>
      ${drawFlag(q)}
      <div class="hint">${HINT[q.kind]}</div>
    </div>
    <div class="options" style="margin-top:14px">${opts.map((o,k)=>`<button class="opt" id="opt${k}">${o.name}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="factbox" id="factbox" hidden><span class="label">Fun fact</span><p class="fact" id="fact"></p></div>
    <div class="levelup" id="levelup" hidden></div>
    <div id="next"></div>`;
  document.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>choose(b,opts[k],q,opts));
}
function choose(btn,choice,q,opts){
  const ok=choice===q;
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(opts[k]===q)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  if(mode==="challenge"){if(ok){score++;points+=q.diff}else lives--;$("score").textContent=points}
  else if(ok){score++;$("score").textContent=score}
  log.push({q,ok});progress();
  streak=ok?streak+1:0;
  if(ok){
    $("fb").textContent=CHEERS[log.length===1?0:Math.random()*CHEERS.length|0];
    if(streak>=3){const t=document.createElement("span");t.className="streak";t.textContent=`${streak} in a row`;$("fb").appendChild(t)}
    btn.classList.add("cheer");const card=document.querySelector("#stage .card");if(card)card.classList.add("glow");
    try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches)confetti(btn)}catch(e){}
  }else $("fb").textContent=`That's ${q.name}.`;
  $("fb").style.color=ok?"var(--good)":"var(--bad)";
  if(q.fact){$("fact").textContent=q.fact;$("factbox").hidden=false}
  if(mode==="challenge"){
    const over=lives===0,up=!over&&tierAt(log.length)>tierAt(log.length-1);
    if(up){$("levelup").textContent=`Level up: ${DIFFS[tierAt(log.length)-1]} flags from here`;$("levelup").hidden=false}
    $("next").innerHTML=`<button class="btn" id="go">${over?"See results":"Next flag"}</button>`;
    $("go").onclick=()=>over?challengeOver():nextChallenge();$("go").focus();return;
  }
  const last=i===total-1;
  $("next").innerHTML=`<button class="btn" id="go">${last?"See results":"Next flag"}</button>${mode==="practice"&&!last?`<button class="btn ghost" id="stop">End practice</button>`:""}`;
  $("go").onclick=()=>{i++;last?results():ask()};$("go").focus();
  if($("stop"))$("stop").onclick=()=>{total=log.length;$("total").textContent=total;results()};
}
function results(){
  i=total;progress();
  const missed=log.filter(l=>!l.ok),pct=total?score/total:0;
  const verdict=pct===1?"Perfect. You know your flags.":pct>=.7?"Strong showing.":pct>=.4?"Not bad. Keep practicing.":"Rough round. Try again!";
  const nextUp=mode==="quiz"&&{easy:"medium",medium:"hard",hard:"expert"}[level];
  $("stage").innerHTML=`<div class="card result">
    <div class="label">Final score · ${mode==="practice"?"practice":level}</div>
    <div class="big">${score}/${total}</div>
    <div>${verdict}</div>
    ${missed.length?`<div class="label" style="margin-top:6px">Flags to study</div><div class="missed">${missed.map(l=>`<div>${drawFlag(l.q,true)}<span>${l.q.name}</span></div>`).join("")}</div>`:""}
    <button class="btn" id="again">${mode==="practice"?"Practice again":"Play again"}</button>
    ${mode==="practice"?`<button class="btn ghost" id="settings">Change settings</button>`:""}
    ${nextUp&&pct>=.7?`<button class="btn ghost" id="up">Try ${nextUp}</button>`:""}
  </div>`;
  $("again").onclick=()=>mode==="practice"?startPractice():startLevel();
  if($("settings"))$("settings").onclick=showSettings;
  if($("up"))$("up").onclick=()=>setLevel(nextUp);
}

/* ---------- leaderboard ---------- */
// One document per player at scores/<their id>, holding their top runs.
// Falls back to this device when the shared store isn't available.
const BOARD={db:null,uid:null,canWrite:null,rows:[],ready:false,shared:false};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LOCAL=store.get("fq-board",[]);
function localRows(){return LOCAL.map(r=>Object.assign({},r,{mine:true}))}
function setRows(rows){BOARD.rows=rows.filter(r=>r&&typeof r.points==="number"&&r.name).sort((a,b)=>b.points-a.points||a.at-b.at);BOARD.ready=true;document.querySelectorAll("[data-board]").forEach(el=>el.innerHTML=boardHTML(+el.dataset.board))}
async function initBoard(){
  setRows(localRows());
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    BOARD.db=db;BOARD.uid=uid;BOARD.shared=true;
    try{BOARD.canWrite=await user.can("data.write")}catch(e){BOARD.canWrite=null}
    db.collection("scores").onSnapshot(snap=>{
      const rows=[];snap.docs.forEach(d=>{const b=d.data()||{};(Array.isArray(b.runs)?b.runs:[]).forEach(r=>rows.push(Object.assign({},r,{mine:d.id===uid})))});
      setRows(rows);
    },()=>{BOARD.shared=false;setRows(localRows())});
  }catch(e){}
}
function boardHTML(n){
  if(!BOARD.ready)return `<p class="boardnote">Loading leaderboard…</p>`;
  const rows=BOARD.rows.slice(0,n);
  if(!rows.length)return `<p class="boardnote">No scores yet. Finish a challenge to post the first one.</p>`;
  return `<ol>${rows.map((r,k)=>`<li class="${r.mine?"me":""}"><span class="rk">${k+1}</span><span class="nm">${esc(r.name)}<span class="sub">${r.flags} flags · reached ${esc(r.reached)}${r.mine?" · you":""}</span></span><span class="pt">${r.points}</span></li>`).join("")}</ol>`+
  `<p class="boardnote">${BOARD.shared?"Shared with everyone who opens this quiz.":"Saved on this device only."}</p>`;
}
async function saveScore(run){
  const name=run.name;
  if(BOARD.shared){
    const ref=BOARD.db.doc("scores/"+BOARD.uid);
    const snap=await ref.get();
    const runs=(snap.exists&&Array.isArray(snap.data().runs)?snap.data().runs.slice():[]);
    runs.push(run);runs.sort((a,b)=>b.points-a.points);
    await ref.set({runs:runs.slice(0,10)});
  }else{
    LOCAL.push(run);LOCAL.sort((a,b)=>b.points-a.points);LOCAL=LOCAL.slice(0,20);store.set("fq-board",LOCAL);setRows(localRows());
  }
  store.set("fq-name",name);
}

/* ---------- challenge ---------- */
function showChallengeHome(){
  $("pennants").innerHTML="";$("pennants").className="pennants";$("score").textContent=0;
  $("stage").innerHTML=`<div class="card">
    <div class="label">Challenge</div>
    <ul class="rules"><li>Starts with easy flags and gets harder as you go.</li><li>Easy flags are worth 1 point, Expert flags 4.</li><li>Three misses and the run is over.</li></ul>
    <button class="btn" id="go">Start challenge</button>
    <div class="label" style="margin-top:8px">Leaderboard</div>
    <div class="board" data-board="10">${boardHTML(10)}</div>
  </div>`;
  $("go").onclick=startChallenge;
}
function startChallenge(){
  qs=[];i=0;score=0;points=0;lives=3;log=[];used=new Set();lastPool=null;streak=0;
  $("score").textContent=0;
  $("stage").innerHTML=`<div class="card"><div class="label">Loading flags…</div></div>`;
  Promise.all(["c","r","f"].map(load)).then(()=>{if(mode==="challenge")nextChallenge()})
  .catch(()=>{$("stage").innerHTML=`<div class="card"><div class="label">Couldn't load the flags</div><button class="btn" id="retry">Try again</button></div>`;$("retry").onclick=()=>{["c","r","f"].forEach(x=>delete loading[x]);startChallenge()}});
}
function nextChallenge(){
  const d=tierAt(log.length);
  // mostly the current level, with an occasional easier flag mixed in
  const want=d>1&&Math.random()<.2?d-1:d;
  let pool=ALL.filter(f=>f.diff===want&&!used.has(f.code));
  if(!pool.length)pool=ALL.filter(f=>f.diff>=d&&!used.has(f.code));
  if(!pool.length)return challengeOver();
  const q=pick(pool,1)[0];used.add(q.code);recent.push(q.code);saveRecent();
  q._opts=shuffle([q,...distractors(q)]);qs.push(q);i=qs.length-1;total=qs.length;ask();
}
function challengeOver(){
  progress();
  const isBest=points>best.points;
  if(isBest){best={points,flags:score};store.set("fq-best",best)}
  const reached=DIFFS[tierAt(log.length)-1];
  const missed=log.filter(l=>!l.ok);
  $("stage").innerHTML=`<div class="card result">
    <div class="label">${isBest?"New personal best":"Challenge over"}</div>
    <div class="big">${points}</div>
    <div>${score} flag${score===1?"":"s"} right · reached ${reached}</div>
    <div class="best">${isBest?"Your best run so far.":`Best: ${best.points} points`}</div>
    ${true?`<div class="label" style="margin-top:6px">Add your name to the leaderboard</div>
    <form class="saveform" id="saveform"><label for="pname" class="sr">Your name</label><input id="pname" maxlength="20" autocomplete="nickname" placeholder="Your name" value="${esc(store.get("fq-name",""))}"><button class="btn" id="savebtn" type="submit">Save</button></form>
    <p class="formmsg" id="formmsg" aria-live="polite"></p>`:""}
    <div class="label" style="margin-top:6px">Leaderboard</div>
    <div class="board" data-board="10">${boardHTML(10)}</div>
    ${missed.length?`<div class="label" style="margin-top:6px">Your three misses</div><div class="missed">${missed.map(l=>`<div>${drawFlag(l.q,true)}<span>${l.q.name}</span></div>`).join("")}</div>`:""}
    <button class="btn" id="again">Play again</button>
  </div>`;
  $("again").onclick=startChallenge;
  if($("saveform")){
    if(BOARD.shared&&BOARD.canWrite===false)$("formmsg").textContent="You can view this leaderboard but not post to it. Ask the quiz's owner for Contributor access.";
    const run={points,flags:score,reached,at:Date.now()};
    $("saveform").addEventListener("submit",async e=>{
      e.preventDefault();
      const name=$("pname").value.trim().replace(/\s+/g," ").slice(0,20);
      if(!name){$("formmsg").textContent="Type a name first.";$("formmsg").style.color="var(--bad)";$("pname").focus();return}
      if(name.toLowerCase()==="aaron"&&!$("askaaron")){
        $("savebtn").disabled=true;$("formmsg").style.color="var(--ink)";
        $("formmsg").innerHTML=`<span id="askaaron">Are you “Aaron Ball Sack”?</span> <span class="chips" style="justify-content:center;margin-top:8px"><button class="chip" id="aaron-yes" type="button">Yes</button><button class="chip" id="aaron-no" type="button">No</button></span>`;
        const finish=n=>{$("pname").value=n;$("savebtn").disabled=false;$("saveform").requestSubmit()};
        $("aaron-yes").onclick=()=>finish("Aaron Ball Sack");
        $("aaron-no").onclick=()=>finish(name);
        return;
      }
      $("savebtn").disabled=true;$("formmsg").style.color="var(--muted)";$("formmsg").textContent="Saving…";
      try{await saveScore(Object.assign({name},run));$("saveform").remove();$("formmsg").style.color="var(--good)";$("formmsg").textContent=`Saved as ${name}.`}
      catch(err){$("savebtn").disabled=false;$("formmsg").style.color="var(--bad)";
        $("formmsg").textContent=err&&err.code==="invalid_argument"?"You can view this leaderboard but not post to it. Ask the quiz's owner for Contributor access.":err&&err.code==="quota_exceeded"?"The leaderboard is full.":"Couldn't save your score. Check your connection and try again."}
    });
  }
}

/* ---------- practice settings ---------- */
const chip=(id,label,on)=>`<button class="chip" id="${id}" aria-pressed="${on}">${label}</button>`;
function showSettings(){
  $("pennants").innerHTML="";$("pennants").className="pennants";$("score").textContent=0;$("total").textContent="–";
  const counts=[5,10,20,50,0];
  $("stage").innerHTML=`<div class="card settings">
    <fieldset><legend>Regions</legend><div class="chips">${CONTS.map(c=>chip("pc-"+c,c,P.conts.includes(c))).join("")}</div></fieldset>
    <fieldset><legend>Flag types</legend><div class="chips">${TYPES.map(([k,l])=>chip("pt-"+k,l,P.types.includes(k))).join("")}</div></fieldset>
    <fieldset><legend>Difficulty</legend><div class="range">
      <label for="dmin">From</label><select id="dmin">${DIFFS.map((d,k)=>`<option value="${k}"${k===P.min?" selected":""}>${d}</option>`).join("")}</select>
      <label for="dmax">to</label><select id="dmax">${DIFFS.map((d,k)=>`<option value="${k}"${k===P.max?" selected":""}>${d}</option>`).join("")}</select>
    </div></fieldset>
    <fieldset><legend>Questions</legend><div class="chips">${counts.map(n=>chip("pn-"+n,n||"All",P.count===n)).join("")}</div></fieldset>
    <p class="match" id="match" aria-live="polite"></p>
    <button class="btn" id="startp">Start practice</button>
  </div>`;
  const refresh=()=>{
    store.set("fq-practice",P);
    CONTS.forEach(c=>$("pc-"+c).setAttribute("aria-pressed",P.conts.includes(c)));
    TYPES.forEach(([k])=>$("pt-"+k).setAttribute("aria-pressed",P.types.includes(k)));
    counts.forEach(n=>$("pn-"+n).setAttribute("aria-pressed",P.count===n));
    const n=practicePool().length;
    $("match").innerHTML=n?`<b>${n}</b> flag${n===1?"":"s"} match${n===1?"es":""}. You'll get ${P.count&&P.count<n?P.count:n} questions.`:"No flags match. Add a region, a flag type or more difficulty levels.";
    $("startp").disabled=!n;
  };
  const toggle=(arr,v)=>{const k=arr.indexOf(v);if(k>=0){if(arr.length>1)arr.splice(k,1)}else arr.push(v)};
  CONTS.forEach(c=>$("pc-"+c).onclick=()=>{toggle(P.conts,c);refresh()});
  TYPES.forEach(([k])=>$("pt-"+k).onclick=()=>{toggle(P.types,k);refresh()});
  counts.forEach(n=>$("pn-"+n).onclick=()=>{P.count=n;refresh()});
  $("dmin").onchange=e=>{P.min=+e.target.value;if(P.max<P.min){P.max=P.min;$("dmax").value=P.max}refresh()};
  $("dmax").onchange=e=>{P.max=+e.target.value;if(P.min>P.max){P.min=P.max;$("dmin").value=P.min}refresh()};
  $("startp").onclick=startPractice;
  refresh();
}
function startPractice(){
  const pool=practicePool();if(!pool.length)return showSettings();
  lastPool=pool;
  begin(shuffle(pick(pool,P.count||pool.length)));
}

/* ---------- mode + level switches ---------- */
function setLevel(l){level=l;document.querySelectorAll("#levels button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===l));startLevel()}
function setMode(m){
  mode=m;document.querySelectorAll("#modes button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===m));
  $("levels").hidden=m!=="quiz";$("leveldesc").hidden=m==="practice";
  $("outof").hidden=m==="challenge";$("scorelabel").textContent=m==="challenge"?"Points":"Score";
  if(m==="challenge")$("leveldesc").textContent=`Starts easy and gets harder. Three misses and you're out. Best: ${best.points} points.`;
  m==="quiz"?startLevel():m==="practice"?showSettings():showChallengeHome();
}
document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>setLevel(b.dataset.l));
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
initBoard();
startLevel();
</script>
